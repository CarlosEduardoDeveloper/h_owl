spring:
  application:
    name: foundation-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
  youversion:
    base-url: ${YVP_BASE_URL:https://api.youversion.com/v1}
    app-key: ${YVP_APP_KEY:}
    callback-url: ${YVP_CALLBACK_URL:}
    connect-timeout-ms: ${YVP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${YVP_READ_TIMEOUT_MS:15000}